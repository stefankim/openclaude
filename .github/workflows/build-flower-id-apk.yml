name: Build Flower ID APK

on:
  push:
    branches:
      - 'claude/flower-id-android-app-cog6lz'
    paths:
      - 'android-flower-id/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android-flower-id/gradlew

      - name: Build Debug APK
        working-directory: android-flower-id
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GardenWeedID-debug
          path: android-flower-id/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename APK
        run: cp android-flower-id/app/build/outputs/apk/debug/app-debug.apk GardenWeedID.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flower-id-latest
          name: Garden Weed ID (latest build)
          body: |
            Latest debug build of the Garden Weed ID Android app.

            **To install:** tap `GardenWeedID.apk` below on your Android phone,
            then allow "Install from unknown sources" when prompted.

            On first launch, open Settings (gear icon) and paste a free
            PlantNet API key from https://my.plantnet.org
          files: GardenWeedID.apk
          prerelease: true
