name: ChronoLux Watch Face

# Builds, tests and lints the ChronoLux Wear OS watch face and publishes the
# debug APK as a downloadable workflow artifact.

on:
  push:
    branches: ["**"]
    paths:
      - "chronolux-watchface/**"
      - ".github/workflows/chronolux-build.yml"
  pull_request:
    paths:
      - "chronolux-watchface/**"
      - ".github/workflows/chronolux-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chronolux-watchface
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ChronoLux-debug-apk
          path: chronolux-watchface/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChronoLux-reports
          path: |
            chronolux-watchface/app/build/reports/tests/**
            chronolux-watchface/app/build/reports/detekt/**
          if-no-files-found: ignore
