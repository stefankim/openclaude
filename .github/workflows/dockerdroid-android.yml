name: DockerDroid Android CI

# Self-contained CI for the native Android app under dockerdroid/. Path-filtered so
# it never runs for changes to the main TypeScript project.
on:
  push:
    branches: ["**"]
    paths:
      - "dockerdroid/**"
      - ".github/workflows/dockerdroid-android.yml"
  pull_request:
    paths:
      - "dockerdroid/**"
      - ".github/workflows/dockerdroid-android.yml"

defaults:
  run:
    working-directory: dockerdroid

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10
          fi

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dockerdroid-debug-apk
          path: dockerdroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  release-apk:
    if: startsWith(github.ref, 'refs/tags/dockerdroid-v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: dockerdroid-release-apk
          path: dockerdroid/app/build/outputs/apk/release/*.apk
