name: DockerDroid Android CI

# Self-contained CI for the native Android app under dockerdroid/. Path-filtered so
# it never runs for changes to the main TypeScript project. Also runnable on demand
# from the Actions tab (workflow_dispatch) to produce a downloadable APK.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which APK to build"
        type: choice
        default: debug
        options: [debug, release, both]
  push:
    branches: ["**"]
    paths:
      - "dockerdroid/**"
      - ".github/workflows/dockerdroid-android.yml"
  pull_request:
    paths:
      - "dockerdroid/**"
      - ".github/workflows/dockerdroid-android.yml"

defaults:
  run:
    working-directory: dockerdroid

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper jar is not committed (binary); generate it once with the
      # runner's system Gradle so ./gradlew is available for the rest of the build.
      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10
          fi

      # Build the APK first so the artifact is produced even if later checks fail.
      - name: Assemble debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK (unsigned)
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        if: ${{ always() && github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: dockerdroid-debug-apk
          path: dockerdroid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: ${{ always() && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: dockerdroid-release-apk
          path: dockerdroid/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # Quality gates run after the artifact is built/uploaded so a lint or test
      # failure never blocks producing a downloadable APK.
      - name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: Unit tests
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: ./gradlew testDebugUnitTest --no-daemon
