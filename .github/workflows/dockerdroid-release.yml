name: DockerDroid Release

# Publishes a permanent, downloadable APK as a GitHub Release asset under a stable
# name, so the download URL is predictable:
#   https://github.com/<owner>/<repo>/releases/download/<tag>/dockerdroid-debug.apk
#
# Triggers:
#   - push a tag `dockerdroid-v*`                → release tagged with that version
#   - manual workflow_dispatch (version input)   → release tagged with the input
#   - push to the dev branch with `[release]` in the commit message
#                                                → rolling `dockerdroid-latest` release
on:
  push:
    tags: ["dockerdroid-v*"]
    branches: ["claude/dockerdroid-android-app-6ug06a"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. dockerdroid-v0.1.0)"
        default: "dockerdroid-v0.1.0"

permissions:
  contents: write

defaults:
  run:
    working-directory: dockerdroid

jobs:
  release:
    # On branch pushes, only publish when the commit opts in with [release]; tag
    # pushes and manual dispatch always publish.
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/') ||
      contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK with a stable name
        run: cp app/build/outputs/apk/debug/app-debug.apk dockerdroid-debug.apk

      - name: Resolve release tag
        id: meta
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "pre=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dockerdroid-latest" >> "$GITHUB_OUTPUT"
            echo "pre=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: DockerDroid ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.pre }}
          body: |
            DockerDroid debug APK (arm64-v8a, Android 12+).

            Modes: on-device root daemon, SSH remote host, and on-device QEMU VM
            (engine wired; native QEMU payload built separately — see docs/VM.md).

            Install: download `dockerdroid-debug.apk`, allow "unknown apps", and if
            Play Protect warns choose "Install anyway". Root is only needed for the
            local-daemon mode; the SSH and VM modes need no root.
          files: dockerdroid/dockerdroid-debug.apk
